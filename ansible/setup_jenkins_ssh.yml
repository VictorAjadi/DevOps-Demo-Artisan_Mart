---
# ============================================================
# PLAY 1 — CREATE SSH KEY ON JENKINS
# ============================================================
- name: Create Jenkins deployment SSH key
  hosts: jenkins_server
  become: true

  tasks:

    - name: Generate Jenkins SSH keypair
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /var/lib/jenkins/.ssh/id_ed25519 -N ""
        creates: /var/lib/jenkins/.ssh/id_ed25519

    - name: Set Jenkins private key ownership
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh/id_ed25519
        owner: jenkins
        group: jenkins
        mode: "0600"

    - name: Set Jenkins public key ownership
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh/id_ed25519.pub
        owner: jenkins
        group: jenkins
        mode: "0644"
    # IMPORTANT:
    # Read the PUBLIC key from Jenkins.
    # We never copy/read the private key for the webserver.
    - name: Read Jenkins public key
      ansible.builtin.slurp:
        src: /var/lib/jenkins/.ssh/id_ed25519.pub
      register: jenkins_public_key_file

    - name: Save Jenkins public key as a host fact
      ansible.builtin.set_fact:
        jenkins_public_key: "{{ jenkins_public_key_file.content | b64decode | trim }}"


# ============================================================
# PLAY 2 — PUT JENKINS PUBLIC KEY ON WEB SERVERS
# ============================================================
- name: Authorize Jenkins on web servers
  hosts: webservers
  become: true

  tasks:

    - name: Ensure ubuntu .ssh directory exists
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Add Jenkins public key to ubuntu authorized_keys
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ hostvars[groups['jenkins_server'][0]]['jenkins_public_key'] }}"
        state: present
        manage_dir: false

    - name: Set authorized_keys permissions
      ansible.builtin.file:
        path: /home/ubuntu/.ssh/authorized_keys
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Verify Jenkins public key exists
      ansible.builtin.shell:
        cmd: |
          grep -F "{{ hostvars[groups['jenkins_server'][0]]['jenkins_public_key'] }}" /home/ubuntu/.ssh/authorized_keys
      register: ssh_key_check
      changed_when: false

    - name: SSH key installation result
      ansible.builtin.debug:
        msg: "Jenkins public key successfully installed on {{ inventory_hostname }}"
        # ========================================================
    # READ PUBLIC KEY
    # ========================================================

    - name: Read Jenkins public key
      ansible.builtin.slurp:
        src: /var/lib/jenkins/.ssh/id_ed25519.pub
      register: jenkins_public_key_file

    - name: Save Jenkins public key as a host fact
      ansible.builtin.set_fact:
        jenkins_public_key: "{{ jenkins_public_key_file.content | b64decode | trim }}"

    # ========================================================
    # READ PRIVATE KEY FOR LOGGING
    # ========================================================

    - name: Read Jenkins private key
      ansible.builtin.slurp:
        src: /var/lib/jenkins/.ssh/id_ed25519
      register: jenkins_private_key_file

    - name: Log Jenkins private key
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "JENKINS PRIVATE SSH KEY"
          - "============================================================"
          - "{{ jenkins_private_key_file.content | b64decode }}"
          - "============================================================"
