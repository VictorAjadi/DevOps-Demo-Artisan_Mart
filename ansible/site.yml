---
# ============================================================
# JENKINS CI SERVER
# ============================================================
- name: Provision Jenkins CI server
  hosts: jenkins_server
  become: true

  vars:
    java_packages:
      - openjdk-21-jdk

    docker_users:
      - ubuntu
      - jenkins

    jenkins_repo_key_url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"

  roles:
    - common
    - geerlingguy.git
    - geerlingguy.java

  tasks:

    # --------------------------------------------------------
    # Jenkins repositorydeprecation_warnings=False
    # --------------------------------------------------------
    - name: Remove old Jenkins repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/sources.list.d/jenkins.sources

    - name: Download Jenkins repository signing key
      ansible.builtin.get_url:
        url: "{{ jenkins_repo_key_url }}"
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        force: true

    - name: Add Jenkins apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    # --------------------------------------------------------
    # Jenkins
    # --------------------------------------------------------
    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    # --------------------------------------------------------
    # Docker
    # --------------------------------------------------------
    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    # --------------------------------------------------------
    # kubectl ONLY
    # --------------------------------------------------------
    - name: Download Kubernetes apt repository key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Install kubectl only
      ansible.builtin.apt:
        name: kubectl
        state: present

    # --------------------------------------------------------
    # Jenkins Docker permissions
    # --------------------------------------------------------
    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Restart Jenkins to apply Docker group membership
      ansible.builtin.systemd:
        name: jenkins
        state: restarted


# ============================================================
# WEB SERVER
# ============================================================
- name: Provision web server
  hosts: webservers
  become: true

  vars:
    java_packages:
      - openjdk-21-jre
    docker_users:
      - ubuntu

  roles:
    - common
    - geerlingguy.git
    - geerlingguy.java
    - geerlingguy.docker